name: Pages 📄

on:
  workflow_dispatch: {}
  push: { branches: [ main ] }

# Needed to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest

    # Use the deployment url to show the environment url.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Enable GitHub Pages - first, to fail fast if permissions fail.
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Checkout without LFS.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Pages workflow
        run: bash scripts/check_pages_workflow.sh

      # Restore LFS assets from cache, so that you don't have to check them out every time, which saves GitHub bundle costs.
      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: lfs-cache
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}

      # Pull any LFS assets that weren't yet cached.
      - name: Git LFS Pull
        run: git lfs pull

      # Cache deps/builds, so that you don't have to compile intermediate libs everytime.
      - name: Cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-build-web

      - name: Install Bevy deps + LLD linker
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev lld

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      # Generate build for web-target. Install Trunk from a pinned release binary
      # rather than a third-party action resolving "latest" via the GitHub API:
      # that lookup intermittently returns an HTML error page instead of JSON and
      # breaks the deploy. A pinned download is reproducible and mirrors the
      # actionlint install in the CI workflow.
      - name: Install trunk
        env:
          TRUNK_VERSION: 0.21.14
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/trunk.tar.gz
          tar -xzf /tmp/trunk.tar.gz -C /tmp trunk
          sudo install -m 0755 /tmp/trunk /usr/local/bin/trunk
          trunk --version

      - name: Build Release
        run: |
          trunk build --release --public-url "/${GITHUB_REPOSITORY#*/}/"

      - name: Validate Pages dist
        run: bash scripts/check_pages_dist.sh

#      # This step actually creates a branch named gh-pages.
#      # which is really not what you want if you have 5MB+ in assets.
#      - name: Deploy to GitHub Pages
#        uses: JamesIves/github-pages-deploy-action@v4.2.5
#        with:
#          branch: gh-pages
#          folder: dist

      # Upload the build and deploy it to GitHub Pages.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'dist/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
